name: check

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # a release of ruff can change its default rules and fail the lint with
      # no change of ours, so the pin moves by a commit
      - run: pip install ruff==0.17.1
      # ruff finds *.py files alone, and the picker has no extension
      - run: ruff check bin/copy bin tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Pygments is optional: one Python runs the picker with it, one without
      - if: matrix.python == '3.13'
        run: pip install pygments
      - run: python tests/test_copy.py
